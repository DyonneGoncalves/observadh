# Configuração de ingestão do tema LGBTQIA+
#
# Atualizado a partir da inspeção real das planilhas em
# ~/Projetos/Observa DH/LGBTQIA+/Planilhas/ (ver catálogo de indicadores no
# projeto Claude para o mapeamento completo formula → aba → categoria).
#
# Arquivos já mapeados (abas confirmadas por inspeção real): Assistência
# Social, Perfil/Registro Civil, Quantas São (PNS/Censo), ONDH, SINAN.
# Ainda faltam confirmar: Educação (SAEB), Saúde (CNES-atendimento, distinto
# do arquivo de Saúde já mapeado em Assistência), Trabalho e Renda.

tema: lgbtqia_plus

planilhas:
  - arquivo: "LGBTQIA_Assistência social_RMA_Censo SUAS_2017_2024.xlsx"
    abas:
      - nome_aba: "CRAS - Temas abordados"
        tabela_raw: raw_lgbtqia_plus_cras_temas_abordados
        cabecalho_linha: 1
      - nome_aba: "Centros de Convivência - Temas "   # nota: espaço extra no nome original da aba
        tabela_raw: raw_lgbtqia_plus_centros_convivencia_temas
        cabecalho_linha: 1
      - nome_aba: "Série atendimentos PAEFI"
        tabela_raw: raw_lgbtqia_plus_serie_atendimentos_paefi
        cabecalho_linha: 1
      - nome_aba: "Atendim CREAS discri orient sex"
        tabela_raw: raw_lgbtqia_plus_creas_discriminacao_orientacao
        cabecalho_linha: 1
      - nome_aba: "Atendim CREAS discri ident gên"
        tabela_raw: raw_lgbtqia_plus_creas_discriminacao_identidade
        cabecalho_linha: 1
      - nome_aba: "Centros Pop"
        tabela_raw: raw_lgbtqia_plus_centros_pop
        cabecalho_linha: 1
      - nome_aba: "Unidades de Acolhimento 2024"
        tabela_raw: raw_lgbtqia_plus_unidades_acolhimento
        cabecalho_linha: 1
      # "dLocalizacao" NÃO entra como raw: é uma tabela de referência
      # (município/UF/região) já extraída para transform/seeds/dim_municipio.csv.
      # Ingerida via seed do dbt, não via pipeline de ingestão anual.

  - arquivo: "LGBTQIA_Perfil_PNS_Estatísticas Registro Civil_2019_2013_2023_V2.xlsx"
    abas:
      - nome_aba: "Pessoas_Orientacao_Sexo_Total"
