# Configuração de ingestão do tema LGBTQIA+
#
# A ingestão é AUTOMÁTICA: todo arquivo .xlsx/.xls em
#   ingestion/input/lgbtqia_plus/<ano>/
# tem TODAS as suas abas importadas para o schema `raw`, uma tabela por aba,
# com nome  <prefixo_tabela>_<planilha>_<aba>:
#   - <planilha> = prefixos_planilha[arquivo] abaixo (ou abreviação automática)
#   - <aba>      = nome da aba INTEIRO, só normalizado (não abreviado)
# Só a parte <planilha> é encurtada se o total passar de 63 caracteres.
#
# Não há mapeamento manual de aba -> tabela. Os nomes finais das tabelas são
# descobertos rodando a ingestão (use --dry-run para vê-los sem gravar).
#
# O mapeamento formula -> aba -> categoria de indicador continua no catálogo
# de indicadores do LGBTQIA+ (no projeto Claude), que também lista as 11
# inconsistências dos documentos-fonte pendentes de decisão da equipe.

tema: lgbtqia_plus

# Prefixo das tabelas raw (mesmo padrão dos temas PSR/PI/PCD).
prefixo_tabela: lgbt

# Schema onde as tabelas brutas e a tabela de log são criadas.
schema_raw: raw

# Abreviação da parte "nome da planilha" no nome da tabela. Chave = nome
# EXATO do arquivo. Se um arquivo não estiver aqui, a ingestão abrevia
# automaticamente (remove ano/versão + dicionário PLANILHA_ABREV do ingest.py).
prefixos_planilha:
  "LGBTQIA_Assistência social_RMA_Censo SUAS_2017_2024.xlsx": assist_social
  "LGBTQIA_Educação_PNS_SAEB_2019_2021.xlsx": educ_pns_saeb
  "LGBTQIA_Perfil_PNS_Estatísticas Registro Civil_2019_2013_2023_V2.xlsx": perfil_pns_est_reg_civil
  "LGBTQIA_Quantas são_PNS_2019_Censo_2010_2022.xlsx": quantas_sao_pns_censo
  "LGBTQIA_Saúde_PNS_Cnes_2019_2025_V2.xlsx": saude_pns_cnes
  "LGBTQIA_Trabalho_PNS_2019.xlsx": trab_pns
  "LGBTQIA_Violência_ONDH_2020_2024.xlsx": viol_ondh
  "LGBTQIA_Violências_Sinan_2015_2024.xlsx": viol_sinan

# Abas a NÃO importar (comparação por nome normalizado, vale para qualquer
# arquivo do tema). "dLocalizacao" é uma tabela de referência
# município/UF/região — já extraída para transform/seeds/dim_municipio.csv e
# carregada via seed do dbt, não faz sentido duplicar como raw.
ignorar_abas:
  - dLocalizacao

ano_padrao: 2026
