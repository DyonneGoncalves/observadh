version: 2

models:
  - name: lgbt_indicadores
    description: >
      Todos os indicadores do relatório LGBTQIA+ no formato longo — uma linha
      por (nivel, recorte_codigo, secao, indicador, categoria, ano_referencia).
      União dos modelos int_lgbt_<secao>_*. É a tabela que a aplicação
      consulta para preencher o texto-base do relatório. Ver
      docs/lgbt/consumo-lgbt_indicadores.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - nivel
              - recorte_codigo
              - secao
              - indicador
              - categoria
              - ano_referencia
    columns:
      - name: nivel
        description: "'nacional' | 'estadual' | 'municipal'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["nacional", "estadual", "municipal"]
      - name: recorte_codigo
        description: >
          NULL no nível nacional; código IBGE da UF (2 dígitos) no estadual;
          código IBGE do município (7 dígitos) no municipal.
      - name: recorte_nome
        description: "'Brasil', nome da UF ou nome do município."
        tests:
          - not_null
      - name: secao
        description: >
          Número da (sub)seção no sumário do relatório: '1', '2', '2.5', '3',
          '4.1', '5.1', '6', '6.1', '7.0', '7.1'.
        tests:
          - not_null
      - name: secao_nome
        description: Nome legível da seção.
      - name: indicador
        description: "Slug estável do indicador, ex. pct_creas_nao_atende_orientacao."
        tests:
          - not_null
      - name: categoria
        description: >
          Quebra dentro do indicador, ex. "Feminino", "2023",
          "Homossexual / Mulheres". NULL quando o indicador é um valor único.
      - name: valor
        description: >
          Numérico. Denominador zero em um percentual devolve 0 ("sem casos" =
          0%). Só linhas de valor_tipo = 'variacao_percentual' podem ser NULL —
          quando a base (ano inicial) é zero e "variação a partir de zero" não
          tem percentual.
        tests:
          - not_null:
              config:
                where: "valor_tipo <> 'variacao_percentual'"
      - name: valor_tipo
        description: "'numero_absoluto' | 'percentual' | 'variacao_percentual'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["numero_absoluto", "percentual", "variacao_percentual"]
      - name: ano_referencia
        description: Ano a que o dado se refere (varia por indicador).
        tests:
          - not_null

  - name: lgbt_indicadores_nacional
    description: Recorte nacional (nivel = 'nacional') do mart longo. Sem colunas de recorte.

  - name: lgbt_indicadores_estadual
    description: Recorte estadual do mart longo. recorte_codigo/nome renomeados para uf_codigo/uf_nome.

  - name: lgbt_indicadores_municipal
    description: Recorte municipal do mart longo. recorte_codigo/nome renomeados para municipio_codigo_ibge/municipio_nome.
