version: 2

models:
  - name: lgbtqia_plus_relatorio_municipal
    description: Indicadores da categoria 6.1 (Proteção Social Especial) por município — piloto.
    columns:
      - name: municipio_codigo_ibge
        tests:
          - not_null
          - unique
      - name: pct_creas_nao_atende_orientacao
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: pct_creas_nao_atende_identidade
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: pct_centros_pop_atenderam_lgbtqia
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: pct_unidades_com_pessoas_trans
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true

  - name: lgbtqia_plus_relatorio_estadual
    description: Indicadores da categoria 6.1 (Proteção Social Especial) por UF — piloto.
    columns:
      - name: uf_codigo
        tests:
          - not_null
          - unique

  - name: lgbtqia_plus_relatorio_nacional
    description: Indicadores da categoria 6.1 (Proteção Social Especial) — Brasil — piloto.
    columns:
      - name: pais
        tests:
          - not_null

# Nota: os testes "dbt_utils.accepted_range" exigem o pacote dbt-utils
# (adicionar em transform/packages.yml: package: dbt-labs/dbt_utils). Se
# preferir não adicionar a dependência agora, substituir por testes
# customizados equivalentes em transform/tests/.
