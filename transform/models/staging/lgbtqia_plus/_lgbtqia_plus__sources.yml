# Sources do tema LGBTQIA+ — tabelas do schema `raw` usadas pelos modelos.
#
# A ingestão (ingestion/ingest.py) importa toda aba de toda planilha para o
# schema `raw`, com nome de tabela = lgbt_<planilha>_<aba>. Por isso cada
# tabela abaixo tem um `identifier` (o nome real no banco) separado do `name`
# (o apelido estável usado nos modelos). Para reconferir os `identifier` após
# uma nova carga: `python ingestion/ingest.py --tema lgbtqia_plus --ano <ano> --dry-run`.
#
# Só declarar aqui a tabela quando um modelo passar a consumi-la.

version: 2

sources:
  - name: raw_lgbtqia_plus
    schema: raw
    loaded_at_field: dt_importacao
    tables:

      # --- 6 / 6.1 — Assistência Social / Proteção Social Especial ---
      - name: raw_lgbtqia_plus_serie_atendimentos_paefi
        identifier: lgbt_assist_social_serie_atendimentos_paefi
        description: >
          Pessoas vítimas de discriminação por orientação sexual que
          ingressaram no PAEFI, por município e mês/ano de referência
          (série 2017-2024). Aba original "Série atendimentos PAEFI".

      - name: raw_lgbtqia_plus_creas_discriminacao_orientacao
        identifier: lgbt_assist_social_atendim_creas_discri_orient_sex
        description: >
          CREAS por município: se atendem casos de discriminação por
          orientação sexual no PAEFI. Aba original "Atendim CREAS discri
          orient sex". Traz uma coluna de % pré-calculada por município —
          usada como golden value para validar nosso próprio cálculo.

      - name: raw_lgbtqia_plus_creas_discriminacao_identidade
        identifier: lgbt_assist_social_atendim_creas_discri_ident_gen
        description: >
          Mesma estrutura da anterior, para discriminação por identidade
          de gênero. Aba original "Atendim CREAS discri ident gên".

      - name: raw_lgbtqia_plus_centros_pop
        identifier: lgbt_assist_social_centros_pop
        description: >
          Centros POP por município: se atenderam pessoas LGBTQIA+. Aba
          original "Centros Pop".

      - name: raw_lgbtqia_plus_unidades_acolhimento
        identifier: lgbt_assist_social_unidades_de_acolhimento_2024
        description: >
          Unidades de acolhimento (grão = UNIDADE, não município — várias
          unidades por município). Aba original "Unidades de Acolhimento
          2024". Não tem coluna de ano de referência (implícito: 2024, ver
          nome da aba) nem código IBGE de 7 dígitos (só 6).

      # --- 5 / 5.1 — Saúde / Serviços de saúde para pessoas trans ---
      - name: raw_lgbtqia_plus_estabelecimento_cnes
        identifier: lgbt_saude_pns_cnes_estabelecimento_cnes
        description: >
          Estabelecimentos de saúde com habilitação para procedimentos de
          atenção a pessoas trans (ambulatorial e/ou hospitalar), CNES 2025.
          Aba "Estabelecimento_CNES". Grão = 1 linha por estabelecimento; UFs
          sem serviço aparecem como 1 linha com tipo_de_habilitacao = 'Não possui'.
