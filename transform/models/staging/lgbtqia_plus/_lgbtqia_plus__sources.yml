# Sources do tema LGBTQIA+ — tabelas do schema `raw` usadas pelos modelos.
#
# A ingestão (ingestion/ingest.py) importa toda aba de toda planilha para o
# schema `raw`, com nome de tabela = lgbt_<planilha>_<aba>. Por isso cada
# tabela abaixo tem um `identifier` (o nome real no banco) separado do `name`
# (o apelido estável usado nos modelos). Para reconferir os `identifier` após
# uma nova carga: `python ingestion/ingest.py --tema lgbtqia_plus --ano <ano> --dry-run`.
#
# Só declarar aqui a tabela quando um modelo passar a consumi-la.

version: 2

sources:
  - name: raw_lgbtqia_plus
    schema: raw
    loaded_at_field: dt_importacao
    tables:

      # --- 6 / 6.0 — Assistência Social / CRAS e Centros de Convivência ---
      - name: raw_lgbtqia_plus_cras_temas_abordados
        identifier: lgbt_assist_social_cras_temas_abordados
        description: >
          Censo SUAS 2024 — CRAS por município: ofertavam SCFV e se abordaram
          frequentemente orientação sexual / identidade de gênero. Aba
          "CRAS - Temas abordados".
      - name: raw_lgbtqia_plus_centros_convivencia_temas
        identifier: lgbt_assist_social_centros_de_convivencia_temas
        description: >
          Censo SUAS 2024 — Centros de Convivência por município: se abordaram
          frequentemente o tema. Aba "Centros de Convivência - Temas".

      # --- 6 / 6.1 — Assistência Social / Proteção Social Especial ---
      - name: raw_lgbtqia_plus_serie_atendimentos_paefi
        identifier: lgbt_assist_social_serie_atendimentos_paefi
        description: >
          Pessoas vítimas de discriminação por orientação sexual que
          ingressaram no PAEFI, por município e mês/ano de referência
          (série 2017-2024). Aba original "Série atendimentos PAEFI".

      - name: raw_lgbtqia_plus_creas_discriminacao_orientacao
        identifier: lgbt_assist_social_atendim_creas_discri_orient_sex
        description: >
          CREAS por município: se atendem casos de discriminação por
          orientação sexual no PAEFI. Aba original "Atendim CREAS discri
          orient sex". Traz uma coluna de % pré-calculada por município —
          usada como golden value para validar nosso próprio cálculo.

      - name: raw_lgbtqia_plus_creas_discriminacao_identidade
        identifier: lgbt_assist_social_atendim_creas_discri_ident_gen
        description: >
          Mesma estrutura da anterior, para discriminação por identidade
          de gênero. Aba original "Atendim CREAS discri ident gên".

      - name: raw_lgbtqia_plus_centros_pop
        identifier: lgbt_assist_social_centros_pop
        description: >
          Centros POP por município: se atenderam pessoas LGBTQIA+. Aba
          original "Centros Pop".

      - name: raw_lgbtqia_plus_unidades_acolhimento
        identifier: lgbt_assist_social_unidades_de_acolhimento_2024
        description: >
          Unidades de acolhimento (grão = UNIDADE, não município — várias
          unidades por município). Aba original "Unidades de Acolhimento
          2024". Não tem coluna de ano de referência (implícito: 2024, ver
          nome da aba) nem código IBGE de 7 dígitos (só 6).

      # --- 5 / 5.1 — Saúde / Serviços de saúde para pessoas trans ---
      - name: raw_lgbtqia_plus_estabelecimento_cnes
        identifier: lgbt_saude_pns_cnes_estabelecimento_cnes
        description: >
          Estabelecimentos de saúde com habilitação para procedimentos de
          atenção a pessoas trans (ambulatorial e/ou hospitalar), CNES 2025.
          Aba "Estabelecimento_CNES". Grão = 1 linha por estabelecimento; UFs
          sem serviço aparecem como 1 linha com tipo_de_habilitacao = 'Não possui'.

      # --- 2 / 2.5 — Perfil / Casamentos e uniões ---
      - name: raw_lgbtqia_plus_casamento_mesmo_sexo_ano
        identifier: lgbt_perfil_pns_est_reg_civil_casamento_mesmo_sexo_ano
        description: >
          Registros de casamento entre pessoas do mesmo sexo por município e
          ano (colunas 2013..2023). Grão = 1 linha por município x categoria
          ("Casamentos entre homens" / "Casamentos entre mulheres"). Aba
          "Casamento_Mesmo_Sexo_Ano".

      - name: raw_lgbtqia_plus_total_casamentos_uf
        identifier: lgbt_perfil_pns_est_reg_civil_total_casamentos_uf
        description: >
          Por UF: total de casamentos entre cônjuges masculino/feminino e total
          de casamentos lesbohomoafetivos. ano_de_referencia = 2022, mas o total
          lesbohomoafetivo bate com a soma de 2023 de Casamento_Mesmo_Sexo_Ano
          (inconsistência a confirmar com a equipe). Aba "Total_Casamentos_UF".

      - name: raw_lgbtqia_plus_pessoas_estado_civil
        identifier: lgbt_perfil_pns_est_reg_civil_pessoas_estado_civil
        description: >
          PNS 2019: população por estado civil (casado/divorciado/viúvo/solteiro)
          e orientação sexual. Grão = 1 linha por orientação (Brasil). Aba
          "Pessoas_Estado_civil".

      - name: raw_lgbtqia_plus_natureza_juridica_uniao
        identifier: lgbt_perfil_pns_est_reg_civil_natureza_juridica_uniao
        description: >
          PNS 2019: população por natureza jurídica da união (casamento civil /
          união estável) e orientação sexual. Grão = 1 linha por orientação
          (Brasil). Aba "Natureza_Jurídica_União".

      # --- 4 / 4.1 — Educação / Projetos escolares contra LGBTQIAfobia ---
      - name: raw_lgbtqia_plus_projetos_contra_homofobia_2019
        identifier: lgbt_educ_pns_saeb_projetos_contra_homofobia_2019
        description: >
          SAEB 2019, por UF: escolas que possuem / não possuem projeto de
          enfrentamento à LGBTQIAfobia. Denominador do indicador = "total com
          informação" (total - ignorado). Aba "Projetos contra homofobia 2019".

      - name: raw_lgbtqia_plus_projetos_contra_homofobia_2021
        identifier: lgbt_educ_pns_saeb_projetos_contra_homofobia_2021
        description: >
          SAEB 2021, por UF: escolas que possuem / não possuem projeto. Sem
          coluna "ignorado" — denominador do indicador = "total". Aba
          "Projetos contra homofobia 2021".

      - name: raw_lgbtqia_plus_projeto_homofobia_local_2021
        identifier: lgbt_educ_pns_saeb_projeto_homofobia_local_2021
        description: >
          SAEB 2021, por UF x localização (Urbana/Rural): total com info e
          escolas com projeto. Aba "projeto_homofobia_local 2021".

      # --- 7 / 7.1 — Violência / Denúncias de violações de DH (ONDH 2020-2024) ---
      # Tabelas em formato largo (1 linha por município, uma coluna por categoria),
      # exceto tipo_de_violacao (1 linha por município x tipo). Sem linha de total
      # Brasil/UF — a agregação é feita nos modelos.
      - name: raw_lgbtqia_plus_ondh_serie_historica
        identifier: lgbt_viol_ondh_ondh_serie_historica_2020_2024
        description: Denúncias e violações por município e ano (2020-2024). Aba "ONDH_Serie_Historica_2020_2024".
      - name: raw_lgbtqia_plus_ondh_sexo
        identifier: lgbt_viol_ondh_ondh_sexo
        description: Denúncias por município e sexo da vítima. Aba "ONDH_Sexo".
      - name: raw_lgbtqia_plus_ondh_faixa_etaria
        identifier: lgbt_viol_ondh_ondh_faixa_etaria
        description: Denúncias por município e faixa etária da vítima. Aba "ONDH_Faixa_Etária".
      - name: raw_lgbtqia_plus_ondh_raca_cor
        identifier: lgbt_viol_ondh_ondh_raca_cor
        description: Denúncias por município e raça/cor da vítima. Aba "ONDH_Raca_Cor".
      - name: raw_lgbtqia_plus_ondh_identidade_genero
        identifier: lgbt_viol_ondh_ondh_identidade_genero
        description: Denúncias por município e identidade de gênero da vítima. Aba "ONDH_Identidade_Genero".
      - name: raw_lgbtqia_plus_ondh_orientacao_sexual
        identifier: lgbt_viol_ondh_ondh_orientacao_sexual
        description: Denúncias por município e orientação sexual da vítima. Aba "ONDH_Orientacao_Sexual".
      - name: raw_lgbtqia_plus_ondh_local
        identifier: lgbt_viol_ondh_ondh_local
        description: Denúncias por município e local de ocorrência (32 categorias). Aba "ONDH_Local".
      - name: raw_lgbtqia_plus_ondh_relacao_suspeito
        identifier: lgbt_viol_ondh_ondh_relacao_suspeito
        description: Denúncias por município e tipo de relação com o suspeito (49 categorias). Aba "ONDH_Relação_Suspeito".
      - name: raw_lgbtqia_plus_ondh_tipo_de_violacao
        identifier: lgbt_viol_ondh_ondh_tipo_de_violacao
        description: >
          Denúncias por município e tipo de violação. Grão = 1 linha por
          município x tipo; a coluna total_com_info É a contagem daquele
          tipo no município (nome enganoso). Aba "ONDH_Tipo_de_Violação".

      # --- 7 / 7.0 — Violência / Notificações SINAN 2015-2024 (dados de 2024
      #     nas tabelas de perfil; a de notificações tem ano_de_referencia) ---
      - name: raw_lgbtqia_plus_sinan_notificacoes
        identifier: lgbt_viol_sinan_notificacoes_2015_2024_sinan
        description: >
          Notificações SINAN por município e ano. Colunas viol_interpessoal,
          viol_autoprovocada, nao_aplica, ignorado, missing e
          total_com_info_de_notificacao. Aba "Notificações_2015_2024_SINAN".
      - name: raw_lgbtqia_plus_sinan_interpessoal_sexo
        identifier: lgbt_viol_sinan_interpessoal_sexo_sinan
        description: Vítimas de violência interpessoal por município e sexo (2024). Aba "Interpessoal_Sexo_SINAN".
      - name: raw_lgbtqia_plus_sinan_interpessoal_faixa_etaria
        identifier: lgbt_viol_sinan_interpessoal_faixa_etaria_sinan
        description: Vítimas de violência interpessoal por município e faixa etária (2024). Aba "Interpessoal_Faixa_Etária_SINAN".
      - name: raw_lgbtqia_plus_sinan_interpessoal_cor_raca
        identifier: lgbt_viol_sinan_interpessoal_cor_ou_raca
        description: Vítimas de violência interpessoal por município e raça/cor (2024). Aba "Interpessoal_Cor_ou_Raça".
      - name: raw_lgbtqia_plus_sinan_autoprovocada_sexo
        identifier: lgbt_viol_sinan_autoprovocada_sexo_sinan
        description: Vítimas de violência autoprovocada por município e sexo (2024). Aba "Autoprovocada_Sexo_SINAN".
      - name: raw_lgbtqia_plus_sinan_autoprovocada_faixa_etaria
        identifier: lgbt_viol_sinan_autoprovocada_faixa_etaria
        description: >
          Vítimas de violência autoprovocada por município e faixa etária (2024).
          Coluna de total tem o nome com typo: "total_com_indo". Aba "Autoprovocada_Faixa_Etária".
      - name: raw_lgbtqia_plus_sinan_autoprovocada_cor_raca
        identifier: lgbt_viol_sinan_autoprovocada_cor_ou_raca
        description: Vítimas de violência autoprovocada por município e raça/cor (2024). Aba "Autoprovocada_Cor_ou_Raça".
      - name: raw_lgbtqia_plus_sinan_violencias_orientacao_sexual
        identifier: lgbt_viol_sinan_violencias_orientacao_sexual
        description: >
          Notificações por município, origem da agressão (interpessoal /
          autoprovocada) e orientação sexual da vítima (2024). Aba
          "Violências_Orientacao_Sexual".
      - name: raw_lgbtqia_plus_sinan_violencias_identidade_genero
        identifier: lgbt_viol_sinan_violencias_identidade_genero
        description: >
          Notificações por município, origem da agressão e identidade de
          gênero da vítima (2024). Aba "Violencias_Identidade_Genero".
      - name: raw_lgbtqia_plus_sinan_interpessoal_local_ocorrencia
        identifier: lgbt_viol_sinan_interpessoal_local_ocorrencia
        description: Violência interpessoal por município e local de ocorrência (2024). Aba "Interpessoal_Local_Ocorrencia".
      - name: raw_lgbtqia_plus_sinan_autoprovocada_local_ocorrencia
        identifier: lgbt_viol_sinan_autoprovocada_local_ocorrencia
        description: Violência autoprovocada por município e local de ocorrência (2024). Aba "Autoprovocada_Local_Ocorrencia".
      - name: raw_lgbtqia_plus_sinan_interpessoal_perfil_agressor
        identifier: lgbt_viol_sinan_interpessoal_perfil_agressor
        description: >
          Violência interpessoal por município e tipo de agressor (2024).
          Coluna total_viol é o denominador. Aba "Interpessoal_Perfil_Agressor".

      # --- 1 e 2 — População e Perfil das pessoas LGBTQIA+ (PNS 2019, Censo) ---
      # Tabelas já no nível Brasil: 1 linha por orientação sexual, colunas de
      # categoria + uma coluna de total. O % é calculado linha a linha.
      - name: raw_lgbtqia_plus_pessoas_orientacao_sexo_total
        identifier: lgbt_perfil_pns_est_reg_civil_pessoas_orientacao_sexo_total
        description: PNS 2019 — população por orientação sexual e sexo (Brasil). Aba "Pessoas_Orientacao_Sexo_Total".
      - name: raw_lgbtqia_plus_pessoas_faixa_etaria
        identifier: lgbt_perfil_pns_est_reg_civil_pessoas_faixa_etaria
        description: PNS 2019 — população por orientação sexual e faixa etária (Brasil). Aba "Pessoas_Faixa_Etaria".
      - name: raw_lgbtqia_plus_pessoas_cor_ou_raca
        identifier: lgbt_perfil_pns_est_reg_civil_pessoas_cor_ou_raca
        description: PNS 2019 — população por orientação sexual e cor/raça (Brasil). Aba "Pessoas_Cor_ou_Raça".
      - name: raw_lgbtqia_plus_pessoas_area_localidade
        identifier: lgbt_perfil_pns_est_reg_civil_pessoas_area_localidade
        description: PNS 2019 — população por orientação sexual e área (urbana/rural) (Brasil). Aba "Pessoas_Area_Localidade".
      - name: raw_lgbtqia_plus_orientacao_sexual_por_uf
        identifier: lgbt_perfil_pns_est_reg_civil_orientacao_sexual_por_uf
        description: PNS 2019 — % da população por orientação sexual, por UF. Aba "Orientação sexual por UF".
      - name: raw_lgbtqia_plus_censo_2010_reg
        identifier: lgbt_quantas_sao_pns_censo_censo_2010_reg
        description: Censo 2010 — pessoas por tipo de relação no domicílio, Brasil e regiões. Aba "Censo_2010_Reg".
      - name: raw_lgbtqia_plus_censo_2010_uf
        identifier: lgbt_quantas_sao_pns_censo_censo_2010_uf
        description: Censo 2010 — pessoas por tipo de relação no domicílio, por UF. Aba "Censo_2010_UF".
      - name: raw_lgbtqia_plus_conjuges_mesmo_sexo_2022
        identifier: lgbt_quantas_sao_pns_censo_conjuges_do_mesmo_sexo_2022
        description: >
          Censo 2022 — pessoas por tipo de relação no domicílio, por município.
          Colunas de contagem vêm como TEXTO com "-" onde não há dado. Aba
          "Cônjuges do mesmo sexo 2022".

      # --- 3 — Trabalho e renda (PNS 2019, só Brasil) ---
      - name: raw_lgbtqia_plus_taxa_ocupacao_orient_sexual
        identifier: lgbt_trab_pns_taxa_de_ocupacao_por_orient_sex
        description: PNS 2019 — % de pessoas ocupadas (18+) por orientação sexual, Brasil. Aba "Taxa de ocupação por orient sex".
      - name: raw_lgbtqia_plus_renda_per_capita
        identifier: lgbt_trab_pns_renda_per_capta
        description: >
          PNS 2019 — população 18+ por orientação sexual e faixa de renda
          domiciliar per capita (5 faixas), Brasil. Cada faixa tem coluna de
          contagem e coluna "_1" com o % pré-calculado. Aba "Renda per capta".
